# Tests every push to main and every pull request: the service (on Linux, running it on the TV's
# Node 16, and on Windows), and the launcher's screens, rendered on a Linux desktop and checked.
# The screens are attached to the run as the "screens" artifact, to look at in a review.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency: # a new push to a pull request replaces its older run
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tv-node: 16 # the TV's Node: the API tests run the service on it
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: matrix.tv-node
        with:
          node-version: ${{ matrix.tv-node }}
      - name: Run the service on the TV's Node
        if: matrix.tv-node
        run: echo "HOMEPLUS_SERVICE_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Service tests
        run: node --test test/*.test.js

  screens:
    name: Launcher screens
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the preview's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev xvfb xauth libgles2 libegl1 libgl1-mesa-dri python3-pil \
            qmlscene qml-module-qtquick2 qml-module-qtgraphicaleffects qml-module-qtmultimedia
      - name: Render and check every screen
        run: tools/test.sh screens
      - name: Load and drive the Control Center's QML
        run: tools/test.sh qml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: build/screens/
          if-no-files-found: ignore
