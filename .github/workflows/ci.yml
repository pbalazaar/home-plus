# Builds and tests every push to main and every pull request:
# - build: the .ipk for the TV, checked, attached to the run as the "homeplus-ipk" artifact;
# - service: the service's tests, on Linux (the Node versions in webOS 5–6 and 22–26) and on Windows;
# - launcher: the launcher's own tests (native/test/), and the Control Center's QML, loaded and driven.
#   Its screens are rendered on a desktop instead (tools/test.sh screens): here they took most of the
#   run, and Mesa under Xvfb isn't the TV's GPU.
# - compatibility: the package checked by webOSbrew's verifier against LG's firmware from webOS 5 on.
# Pushing a tag like v1.0.0 does the same, and once all of it has passed, publishes a GitHub release
# with the package and its manifest attached.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read # only the release job writes (the release)

concurrency: # a new push to a branch or pull request replaces its older run; a tag's run is never cut short
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # openlgtv/buildroot-nc4 release; keep in step with docker/Dockerfile. Its files' SHA-256s are in
  # docker/toolchain.sha256, and change with it.
  SDK_RELEASE: 2026.08-webos
  SDK_FILE: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK: /home/runner/toolchain/arm-webos-linux-gnueabi_sdk-buildroot
  # webOSbrew's compatibility checker (webosbrew/dev-toolbox-cli), built from this commit. It reads the
  # firmware data from its own source folder, so that's cached along with the binary.
  VERIFY_REV: 2d5a7b6881850d825aa7fdc6c0b5e53c91dc40d3
  VERIFY_DIR: /home/runner/webosbrew-verify
  # The firmware Home+ supports: webOS 5 (2020) and later, which can all be rooted and whose Node (8.12
  # and later) runs the service. webOS 4 and older have Node 0.12 or older.
  VERIFY_FW: '>=5.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache the webOS toolchain
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/toolchain
          key: webos-sdk-${{ env.SDK_RELEASE }}-x86_64-${{ hashFiles('docker/toolchain.sha256') }}

      - name: Fetch the webOS toolchain, and check it's the one Home+ is built with
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$SDK_FILE" "https://github.com/openlgtv/buildroot-nc4/releases/download/${SDK_RELEASE}/${SDK_FILE}"
          (cd "$RUNNER_TEMP" && grep " $SDK_FILE\$" "$GITHUB_WORKSPACE/docker/toolchain.sha256" | sha256sum -c -)
          mkdir -p /home/runner/toolchain
          tar xzf "$RUNNER_TEMP/$SDK_FILE" -C /home/runner/toolchain
          rm "$RUNNER_TEMP/$SDK_FILE"

      - name: Point the toolchain at its location
        run: "$WEBOS_SDK/relocate-sdk.sh"

      - name: Build
        run: tools/build-release.sh

      - name: Check the package
        run: node tools/check-package.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homeplus-ipk
          path: |
            dist/*.ipk
            dist/*.manifest.json

  service:
    name: Service (${{ matrix.os }}${{ matrix.tv-node && format(', Node {0}', matrix.tv-node) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tv-node: '8.12.0' # webOS 5 and 6; the runner stays on Node 22
          - os: ubuntu-24.04
            tv-node: '12.21.0' # webOS 22
          - os: ubuntu-24.04
            tv-node: '12.22.2' # webOS 23
          - os: ubuntu-24.04
            tv-node: '16.19.1' # webOS 24
          - os: ubuntu-24.04
            tv-node: '16.20.2' # webOS 25
          - os: ubuntu-24.04
            tv-node: '20.12.2' # webOS 26
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.tv-node
        with:
          node-version: ${{ matrix.tv-node }}
      - name: Run the service on the TV's Node
        if: matrix.tv-node
        run: echo "HOMEPLUS_SERVICE_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Service tests
        run: node --test test/*.test.js

  # Keep the existing required Linux check while testing every TV runtime above.
  # This gate succeeds only after the entire service matrix has succeeded.
  service-required:
    name: Service (ubuntu-24.04)
    needs: service
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All service runtimes passed
        env:
          SERVICE_RESULT: ${{ needs.service.result }}
        run: test "$SERVICE_RESULT" = success

  launcher:
    name: Launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the preview's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev xvfb xauth libgles2 libegl1 libgl1-mesa-dri python3-pil \
            qmlscene qml-module-qtquick2 qml-module-qtgraphicaleffects qml-module-qtmultimedia
      - name: The launcher's own tests
        run: tools/test.sh native
      - name: Load and drive the Control Center's QML
        run: tools/test.sh qml

  compatibility:
    name: Compatibility
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homeplus-ipk
          path: dist

      - name: Cache the compatibility checker
        id: verify-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VERIFY_DIR }}
          key: webosbrew-verify-${{ env.VERIFY_REV }}

      - name: Build the compatibility checker
        if: steps.verify-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$VERIFY_DIR" && cd "$VERIFY_DIR"
          git fetch -q --depth 1 https://github.com/webosbrew/dev-toolbox-cli "$VERIFY_REV"
          git checkout -q FETCH_HEAD
          cargo build --release --locked -p ipk-verify
          mkdir bin && mv target/release/webosbrew-ipk-verify bin/ && rm -rf target .git # (its data stays: common/data)

      - name: Check the package against LG's firmware
        run: |
          "$VERIFY_DIR/bin/webosbrew-ipk-verify" --fw-releases "$VERIFY_FW" --format markdown \
            --output "$RUNNER_TEMP/compatibility.md" dist/*.ipk
          status=$?
          cat "$RUNNER_TEMP/compatibility.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
        shell: bash {0} # (the summary is written whatever the verdict)

  release:
    name: Release
    needs: [build, service, launcher, compatibility]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homeplus-ipk # the package the build job made and checked
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # (no checkout here)
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipk dist/*.manifest.json --title "Home+ $GITHUB_REF_NAME" --generate-notes
